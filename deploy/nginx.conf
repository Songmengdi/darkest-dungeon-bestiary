server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ^~ 优先于下方扩展名规则,保住带 hash 文件名的长缓存
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 静态资源不存在即 404,禁止 SPA 兜底返回可缓存的 index.html(缓存会被污染)
  location ~* \.(png|json|svg|webp|ico|woff2)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
